name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning php2shell-check.sh

  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["5.6", "7.4", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Syntax check
        run: php -l php2shell-check.php

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scanner (any verdict is fine, it must not crash)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
          set +e
          sudo ./php2shell-check.sh --no-color --scan-dir "$GITHUB_WORKSPACE"
          code=$?
          echo "exit code: $code"
          [ "$code" -le 3 ]
